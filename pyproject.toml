[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safepatch"
version = "0.1.0"
description = "A deterministic safety gate for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SafePatch contributors" }]
dependencies = []

[project.scripts]
safepatch = "safepatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
